services:
  api:
    build:
      context: ./backend/api
    image: ims-api:develop
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker,seed-data
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 10h
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://web:4200}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microservice
      - kafka-net
      - redis
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
#
#  web:
#    image: web:latest
#    ports:
#      - "4200:4200"
#    networks:
#      - microservice
#    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:8.2.0
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "WnLkTHhkQaiJbwP8FClPhw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091
      KAFKA_LISTENERS: "PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9090,EXTERNAL://${HOSTNAME:-localhost}:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # single broker properties
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    mem_limit: 1500m
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - ./infra/kafka/server.properties:/opt/kafka/config/server.properties
    networks:
      - kafka-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9090"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  postgres:
    image: postgres:17-alpine3.19
    environment:
      POSTGRES_USER: ${DATABASE_USER:-default}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-ims}
      PGDATA: /data/postgres
    mem_limit: 512m
    volumes:
      - postgres:/data/postgres
      - ./infra/postgres:/docker-entrypoint-initdb.d
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    networks:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-default} -d ${DATABASE_NAME:-ims}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis
    mem_limit: 256m
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  microservice:
    driver: bridge
  kafka-net:
    driver: bridge
  postgres:
    driver: bridge
  redis:
    driver: bridge

volumes:
  kafka-1-data:
  postgres:
