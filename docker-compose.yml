services:
  api:
    build:
      context: ./backend/api
    image: ims-api:develop
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker,seed-data
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 10h
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://web:4200}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microservice
      - kafka-net
      - redis
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: "tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}"
    networks:
      - microservice

#  ngrok:
#    image: ngrok/ngrok
#    restart: unless-stopped
#    environment:
#      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
#    command:
#      - "http"
#      - "api:8080"
#    networks:
#      - microservice
#    ports:
#      - "4040:4040"
#    depends_on:
#      api:
#        condition: service_healthy

#  web:
#    image: web:latest
#    ports:
#      - "4200:4200"
#    networks:
#      - microservice
#    restart: unless-stopped

  # --- Observability (phase-6 epic, docker/local profiles only — see docs/observability.md) ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - microservice
    # Headroom above collector-config.yaml's memory_limiter (limit_mib: 300) for the
    # process's own baseline + GC overhead, without leaving the container uncapped.
    mem_limit: 512m
    cpus: 1.0

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - microservice
    depends_on:
      - otel-collector
    mem_limit: 512m
    cpus: 1.0

  zipkin:
    image: openzipkin/zipkin:latest
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - microservice
    mem_limit: 512m
    cpus: 1.0

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - microservice
    depends_on:
      - prometheus
      - zipkin
    mem_limit: 256m
    cpus: 0.5

  kafka:
    image: confluentinc/cp-kafka:8.2.0
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "WnLkTHhkQaiJbwP8FClPhw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091
      KAFKA_LISTENERS: "PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9090,EXTERNAL://${HOSTNAME:-localhost}:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # single broker properties
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    mem_limit: 1500m
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - ./infra/kafka/server.properties:/opt/kafka/config/server.properties
    networks:
      - kafka-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9090"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  postgres:
    image: postgres:17-alpine3.19
    environment:
      POSTGRES_USER: ${DATABASE_USER:-default}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-ims}
      PGDATA: /data/postgres
    mem_limit: 512m
    volumes:
      - postgres:/data/postgres
      - ./infra/postgres:/docker-entrypoint-initdb.d
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    networks:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-default} -d ${DATABASE_NAME:-ims}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis
    mem_limit: 256m
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  microservice:
    driver: bridge
  kafka-net:
    driver: bridge
  postgres:
    driver: bridge
  redis:
    driver: bridge

volumes:
  kafka-1-data:
  postgres:
  prometheus-data:
  grafana-data:
