name: API deploy

on:
  push:
    branches: [main]
    paths:
      - backend/api/**
      - .github/workflows/api-deploy.yml
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling a rollout mid-way.
concurrency:
  group: api-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: eva-packaging
  REGION: us-east4
  SERVICE: ims-api
  IMAGE: us-east4-docker.pkg.dev/eva-packaging/ims/api
  # From `terraform output` in infra/terraform (github_actions.tf) — identifiers, not secrets.
  WORKLOAD_IDENTITY_PROVIDER: projects/95207592372/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOYER_SERVICE_ACCOUNT: ims-api-deployer@eva-packaging.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers starts Postgres/Redis/Kafka on the runner's Docker daemon.
      - name: Test
        run: ./mvnw -B verify

      # Turn Surefire results into annotations so failures show on the run summary (and via
      # the public check-runs API) without digging through the raw log.
      - name: Report test failures
        if: failure()
        shell: python
        run: |
          import glob, re, xml.etree.ElementTree as ET

          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          # Nested @DisplayName classes make testcase classname a display string, so locate the
          # source from the first project frame in the stack trace instead.
          FRAME = re.compile(r"at (xyz\.catuns\.[\w.]+?)(?:\$[\w$]+)?\.[\w$<>]+\(\w+\.java:(\d+)\)")

          suites, failures = [], []
          for path in glob.glob("target/surefire-reports/TEST-*.xml"):
              suite = ET.parse(path).getroot()
              suites.append((float(suite.get("time", 0)), suite.get("name")))
              for case in suite.iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is None:
                          continue
                      trace = node.text or ""
                      m = FRAME.search(trace)
                      file = ("backend/api/src/test/java/" + m.group(1).replace(".", "/") + ".java") if m else None
                      line = m.group(2) if m else None
                      message = (node.get("message") or "").strip() or (trace.strip().splitlines() or [""])[0]
                      failures.append(dict(cls=case.get("classname", ""), name=case.get("name"), secs=case.get("time"),
                                           kind=kind, etype=node.get("type", ""), message=message,
                                           detail=message + "\n" + "\n".join(trace.splitlines()[:15]),
                                           file=file, line=line))

          if not suites:
              print("::error title=No Surefire reports::target/surefire-reports is empty — the build failed before or outside the tests")
          # GitHub keeps at most 10 error annotations per step; the full list goes in the notice below.
          for f in failures[:10]:
              loc = f"file={f['file']},line={f['line']}," if f["file"] else ""
              title = f"{f['cls'].rsplit('.', 1)[-1]}.{f['name']} {f['kind']} ({f['secs']}s): {f['etype']}"
              print(f"::error {loc}title={esc(title)}::{esc(f['detail'].strip())}")
          if failures:
              listing = "\n".join(f"{f['cls'].rsplit('.', 1)[-1]} > {f['name']} ({f['secs']}s): {f['message'].splitlines()[0][:200] if f['message'] else f['etype']}"
                                   for f in failures)
              print(f"::notice title=All {len(failures)} failures::{esc(listing)}")
          slowest = ", ".join(f"{n.rsplit('.', 1)[-1]} {t:.0f}s" for t, n in sorted(suites, reverse=True)[:8])
          print(f"::notice title={len(failures)} failed of {len(suites)} suites; slowest::{esc(slowest)}")

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/api/target/surefire-reports/
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend/api
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Only the image changes — env, secrets, probes and scaling stay as Terraform set them.
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/actuator/health"
