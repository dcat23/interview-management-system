name: API deploy

on:
  push:
    branches: [main]
    paths:
      - backend/api/**
      - .github/workflows/api-deploy.yml
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling a rollout mid-way.
concurrency:
  group: api-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: eva-packaging
  REGION: us-east4
  SERVICE: ims-api
  IMAGE: us-east4-docker.pkg.dev/eva-packaging/ims/api
  # From `terraform output` in infra/terraform (github_actions.tf) — identifiers, not secrets.
  WORKLOAD_IDENTITY_PROVIDER: projects/95207592372/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOYER_SERVICE_ACCOUNT: ims-api-deployer@eva-packaging.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers starts Postgres/Redis/Kafka on the runner's Docker daemon.
      - name: Test
        run: ./mvnw -B verify

      # Turn Surefire results into annotations so failures show on the run summary (and via
      # the public check-runs API) without digging through the raw log.
      - name: Report test failures
        if: failure()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET

          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          suites, failures = [], []
          for path in glob.glob("target/surefire-reports/TEST-*.xml"):
              suite = ET.parse(path).getroot()
              suites.append((float(suite.get("time", 0)), suite.get("name")))
              for case in suite.iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is None:
                          continue
                      cls = case.get("classname", "")
                      detail = (node.get("message") or "") + "\n" + "\n".join((node.text or "").splitlines()[:15])
                      failures.append((cls, case.get("name"), case.get("time"), kind, node.get("type", ""), detail))

          if not suites:
              print("::error title=No Surefire reports::target/surefire-reports is empty — the build failed before or outside the tests")
          # GitHub keeps at most 10 error annotations per step; the first ones are the useful ones.
          for cls, name, secs, kind, etype, detail in failures[:10]:
              file = "backend/api/src/test/java/" + cls.split("$")[0].replace(".", "/") + ".java"
              title = f"{cls.rsplit('.', 1)[-1]}.{name} {kind} ({secs}s): {etype}"
              print(f"::error file={file},title={esc(title)}::{esc(detail.strip())}")
          slowest = ", ".join(f"{n.rsplit('.', 1)[-1]} {t:.0f}s" for t, n in sorted(suites, reverse=True)[:8])
          print(f"::notice title={len(failures)} failed of {len(suites)} suites; slowest::{esc(slowest)}")

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/api/target/surefire-reports/
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend/api
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Only the image changes — env, secrets, probes and scaling stay as Terraform set them.
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/actuator/health"
