app:
  job:
    session-auto-transition:
      cron: "0 0 * * * *"
  kafka:
    partitions: 1
    replicas: 1
    topics:
      session-status-changed: session.status.changed
  open-api:
    description: @project.description@
    title: @project.name@
    version: @project.version@
spring:
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: imp-question-capture-mcp-server
        version: "1.0.0"
        type: sync
        instructions: >
          Tools for looking up interview clients, candidates, sessions, and existing questions,
          and for capturing new interview questions directly onto the active session. Search
          before creating: use search_questions/list_session_questions to check for an existing
          match, and link_existing_question instead of add_questions_to_session when one is found.
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
        # Spring AI's default ToolCallbackConverterAutoConfiguration builds McpSchema.Tool
        # objects with no ToolAnnotations (readOnlyHint/destructiveHint/etc. all null), which
        # makes read-only and mutating tools indistinguishable to MCP clients that gate write
        # confirmation on readOnlyHint. McpToolConfig.syncTools() replaces it with an equivalent
        # bean that also stamps the correct annotations — see the Javadoc on that class.
        tool-callback-converter: false
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false
  application:
    name: api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      port: ${REDIS_PORT:6379}
      host: ${REDIS_HOST:localhost}
    web:
      pageable:
        page-parameter: page
        size-parameter: limit
        default-page-size: 20
  datasource:
    password: ${DATABASE_PASSWORD:password}
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:ims}
    username: ${DATABASE_USER:default}
  flyway:
    enabled: true
  kafka:
    producer:
      retries: 10
      acks: all
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "delivery.timeout.ms": 60000
        "request.timeout.ms": 30000
        "linger.ms": 0
        "max.in.flight.requests.per.connection": 5
        "enable.idempotence": true
    bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: api-group
      properties:
        "spring.json.trusted.packages": "xyz.catuns.ims.api.*"
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  profiles:
    active: dev
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: false
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    liveness-state:
      enabled: true
    readiness-state:
      enabled: true
  metrics:
    distribution:
      # Without this, http.server.requests publishes only a count/sum and a single
      # le="+Inf" bucket — no real distribution, so histogram_quantile() over it always
      # returns NaN. Confirmed against a live stack (phase-6 story 3's Grafana P95/P99
      # panel) before this was found and fixed.
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        # Micrometer's OTLP registry defaults to BASE2_EXPONENTIAL_BUCKET_HISTOGRAM, which
        # the otel-collector's Prometheus exporter cannot render as classic le-bucket
        # series — histogram_quantile() sees only a single le="+Inf" bucket and returns
        # NaN regardless of percentiles-histogram above. Confirmed against a live stack.
        histogram-flavor: explicit_bucket_histogram
  tracing:
    sampling:
      probability: 1.0
jwt:
  secret: ${JWT_SECRET}
  issuer: ${spring.application.name}
  expiration: PT1H
  security:
    public-paths:
      - /auth/login
      - /auth/refresh
      - /actuator/health/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /error/**
