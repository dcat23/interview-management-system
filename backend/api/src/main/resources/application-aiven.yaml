spring:
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS}
    security:
      protocol: SSL
    ssl:
      bundle: aiven-kafka
  ssl:
    bundle:
      # Each file can be overridden on its own (KAFKA_SSL_CERT/KEY/CA) for Cloud Run, which
      # mounts every Secret Manager secret into its own directory — see infra/terraform.
      pem:
        aiven-kafka:
          keystore:
            certificate: ${KAFKA_SSL_CERT:file:${KAFKA_SSL_DIR:/etc/kafka-ssl}/service.cert}
            private-key: ${KAFKA_SSL_KEY:file:${KAFKA_SSL_DIR:/etc/kafka-ssl}/service.key}
          truststore:
            certificate: ${KAFKA_SSL_CA:file:${KAFKA_SSL_DIR:/etc/kafka-ssl}/ca.pem}
app:
  kafka:
    replicas: ${KAFKA_REPLICAS:3}
