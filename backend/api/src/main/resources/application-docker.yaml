spring:
  data:
    redis:
      host: redis
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:postgres}:${DATABASE_PORT:5432}/${DATABASE_NAME:ims}
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS:kafka:9090}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false
management:
  otlp:
    tracing:
      # otel-collector service added in phase-6 story 3; harmless (logged, non-fatal)
      # export failures until that container exists.
      endpoint: http://otel-collector:4318/v1/traces
server:
  port: 8080
logging:
  level:
    root: warn
    xyz:
      catuns:
        imp:
          api: info
