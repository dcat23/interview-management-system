spring:
  jpa:
    hibernate:
      ddl-auto: none
  # No collector running locally — spans go to the console via LoggingSpanExporter
  # (config/DevTracingConfig.java) instead of being pushed over OTLP.
  autoconfigure:
    exclude: org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
logging:
  level:
    root: info
    xyz:
      catuns:
        imp:
          api: debug
